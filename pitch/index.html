<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>RubiqOS · Pitch deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css?v=20261018c">
<style>
  html, body { height: 100%; overflow: hidden; }
  body { background: #0a1220; }
  .deck { position: fixed; top: 48px; left: 0; right: 0; bottom: 0; display: grid; place-items: center; }
  .deck img { max-width: calc(100vw - 140px); max-height: calc(100vh - 48px - 40px); width: auto; height: auto; aspect-ratio: 16 / 9; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45); border-radius: 4px; background: #0a1220; }
  .arrow { position: fixed; top: 50%; transform: translateY(-50%); width: 52px; height: 52px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.25); background: rgba(255, 255, 255, 0.08); color: #fff; font-size: 26px; line-height: 1; cursor: pointer; display: grid; place-items: center; }
  .arrow:hover { background: rgba(255, 255, 255, 0.18); }
  .arrow.l { left: 24px; } .arrow.r { right: 24px; }
  .count { position: fixed; bottom: 12px; left: 0; right: 0; text-align: center; font: 500 12px var(--body); color: rgba(255, 255, 255, 0.55); letter-spacing: 0.04em; }
  @media (max-width: 720px) { .deck img { max-width: 100vw; } .arrow { width: 40px; height: 40px; } .arrow.l { left: 8px; } .arrow.r { right: 8px; } }
</style>
</head>
<body>
<div class="sitenav"><div class="in"><a class="brand" href="/">RubiqOS</a><nav><a href="/">Live demo</a><a href="/proforma/">Proforma</a><a href="/physical-ai/">Physical AI</a><a href="/pitch/" class="on">Pitch deck</a><a href="/market/">Resort Market Overview</a></nav><span></span></div></div>
<div class="deck"><img id="img" src="s01.png" alt="Slide 1"></div>
<button class="arrow l" id="prev" aria-label="Previous slide">‹</button>
<button class="arrow r" id="next" aria-label="Next slide">›</button>
<div class="count" id="count"></div>
<script>
const N = 10;
let i = Math.max(0, Math.min(N - 1, (parseInt((location.hash.match(/\d+/) || [1])[0], 10) || 1) - 1));
const img = document.getElementById('img'), count = document.getElementById('count');
function show(k) { i = (k + N) % N; const n = String(i + 1).padStart(2, '0'); img.src = `s${n}.png`; img.alt = `Slide ${i + 1}`; count.textContent = `${i + 1} / ${N}`; history.replaceState(null, '', '#' + (i + 1)); }
document.getElementById('prev').onclick = () => show(i - 1);
document.getElementById('next').onclick = () => show(i + 1);
addEventListener('keydown', e => { if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); show(i + 1); } if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); show(i - 1); } });
let x0 = null; addEventListener('pointerdown', e => { x0 = e.clientX; }); addEventListener('pointerup', e => { if (x0 !== null && Math.abs(e.clientX - x0) > 40) show(e.clientX < x0 ? i + 1 : i - 1); x0 = null; });
for (let k = 1; k <= N; k++) { const pre = new Image(); pre.src = `s${String(k).padStart(2, '0')}.png`; }
show(i);
</script>
</body>
</html>
