/* Layout: one fixed toolbar, one wide scrolling matrix with a sticky name rail and sticky rotated headers; groups are collapsible bands. */

<div class="top">
  <div class="hrow">
    <h1>Resort Market Overview</h1>
    <input type="search" id="q" placeholder="Search project, developer, country" aria-label="Search">
    <span class="dbnote" id="dbnote"></span>
  </div>
  <div class="chiprow">
    <div class="chips" id="chips" role="group" aria-label="Archetypes"></div>
    <div class="seg mode" role="group" aria-label="Show as">
      <button id="mMat" aria-pressed="true"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2" width="13" height="12" rx="1.5"/><path d="M1.5 6h13M1.5 10h13M6 2v12M10.5 2v12"/></svg><span>Matrix</span></button><button id="mMap" aria-pressed="false"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 3.5l4-1.5 5 1.5 4-1.5v10.5l-4 1.5-5-1.5-4 1.5z"/><path d="M5.5 2v10.5M10.5 3.5V14"/></svg><span>Map</span></button>

  </div>
</div>

  <svg id="mapsvg" role="img" aria-label="World map of the projects"></svg>

    <div class="grp" id="mstages" role="group" aria-label="Stage"></div>

      <div class="seg" id="msize" role="group" aria-label="Dot size"><button data-k="dots" aria-pressed="true">Dots</button><button data-k="fit" aria-pressed="false">Fit</button><button data-k="opex" aria-pressed="false">Opex</button><button data-k="area" aria-pressed="false">Area</button><button data-k="keys" aria-pressed="false">Keys</button><button data-k="staff" aria-pressed="false">Staff</button></div>
    </div>

</div>

  const sumTip = p => `${p.label}: total ${p.k==="opex" ? "$"+fmt(sums.opex)+"M per year" : fmt(sums[p.k])} across ${sumN[p.k]} of ${mrows.length} projects with data; clusters and portfolios excluded to avoid double counting`;

  h += `<tr class="cols"><th class="name"><div class="hlbl">Project</div></th>`

     + PARAMS.map(p=>`<th class="pm${p.cls?" "+p.cls:""}${k===p.k?" sorted":""}" data-sort="${p.k}"${ariaSort(p.k)} title="Sort by ${esc(p.label)}"><span class="sum"${p.sum?` title="${esc(sumTip(p))}"`:""}>${p.sum?sumTxt(p):""}</span><span class="arrow">${arrow(p.k)}</span><span class="rot">${esc(p.label)}</span></th>`).join("")

  h += `<tr class="tot"><th class="name" style="text-align:left;font-family:var(--font-body);font-size:11.5px;color:var(--muted)" title="Medians over ${mrows.length} projects: clusters and portfolios excluded">${rows.length}${rows.length<DATA.rows.length?" of "+DATA.rows.length:""} projects · ${tgt?"median":"median / count"}</th><th class="ctry"></th>`

          return `<th class="pm"></th>`; }).join("")
            : colIdx.map(i=>`<th data-col="${i}" class="count" title="${esc(DATA.cols[i].name)}: ${total[i]} of ${rows.length}">${total[i]||""}</th>`).join("")) + "</tr>";

// contact edits: one write per change, awaited per document
const writing = {};
async function saveContact(key, patch){
  if (!dbRef || !canWrite) return;
  const next = Object.assign({}, contacts[key] || {}, patch, {updatedAt: new Date().toISOString()});
  contacts[key] = next;
  while (writing[key]) await writing[key];
  writing[key] = dbRef.doc(key).set(next).catch(err => { $("dbnote").textContent = "Could not save: " + (err && err.message || "error"); }).finally(() => { delete writing[key]; });
}
$("m").addEventListener("change", e => {
  const el = e.target;
  if (el.matches("select.sts")) { el.className = "sts s" + STATUSES.indexOf(el.value); saveContact(el.dataset.key, {status: el.value}); }
  if (el.matches("input.note")) saveContact(el.dataset.key, {note: el.value.trim().slice(0, 300)});
});

(async () => {
  try {
    const db = window.claude && await window.claude.use("db");
    if (!db) return;
    const user = await window.claude.use("user");
    dbRef = db.collection("contacts");
    canWrite = user ? (user.can ? (await user.can("data.write")) !== false : true) : true;
    dbRef.onSnapshot(snap => {
      snap.docs.forEach(doc => { const v = doc.data(); if (v) contacts[doc.id] = {status: v.status, note: v.note}; });
      snap.docChanges().forEach(c => { if (c.type === "removed") delete contacts[c.doc.id]; });
      rerenderSafely();
    }, () => { dbRef = null; rerenderSafely(); });
    rerenderSafely();
  } catch (e) { dbRef = null; }
})();

    + `<dl><dt>Area</dt><dd>${f(num(d.p.area))} ha</dd><dt>Keys</dt><dd>${f(num(d.p.keys))}</dd><dt>Staff</dt><dd>${f(num(d.p.staff))}</dd><dt>Operators</dt><dd>${f(num(d.p.ops))}</dd><dt>Model opex</dt><dd>$${f(num(d.p.opex))}M/yr</dd><dt>Fit</dt><dd>${d.fit}</dd></dl>`
    + (d.owner ? `<div class="m" style="margin-top:6px">${esc(d.owner)}</div>` : "") + web;
  c.style.display = "block";
  const r = e.target.getBoundingClientRect();
  const x = (e.clientX || r.x) - b.left, y = (e.clientY || r.y) - b.top;
  c.style.left = Math.max(6, Math.min(x + 12, b.width - c.offsetWidth - 6)) + "px";
  c.style.top = Math.max(6, Math.min(y + 12, b.height - c.offsetHeight - 6)) + "px";
}
function hideCard(){ const c = $("mcard"); if (c) c.style.display = "none"; }
function goRegion(name){
  const bb = REGIONS[name], b = $("mapbox").getBoundingClientRect();
  if (!bb) { M.svg.transition().duration(600).call(M.zoom.transform, d3.zoomIdentity); return; }
  const [[x0,y0],[x1,y1]] = bb;
  const p = [[x0,y0],[(x0+x1)/2,y0],[x1,y0],[x0,y1],[(x0+x1)/2,y1],[x1,y1]].map(q => M.proj([q[0]>180?q[0]-360:q[0], q[1]]));
  const xs = p.map(q=>q[0]), ys = p.map(q=>q[1]);
  const bx0 = Math.min(...xs), bx1 = Math.max(...xs), by0 = Math.min(...ys), by1 = Math.max(...ys);
  const s = Math.min(60, 0.92 / Math.max((bx1-bx0)/b.width, (by1-by0)/b.height));
  M.svg.transition().duration(700).call(M.zoom.transform, d3.zoomIdentity.translate(b.width/2, b.height/2).scale(s).translate(-(bx0+bx1)/2, -(by0+by1)/2));
}
function setMode(mode){
  state.mode = mode;
  try { localStorage.setItem("dbm-mode", mode); } catch(e){}
  document.body.classList.toggle("m-map", mode === "map");
  $("mMat").setAttribute("aria-pressed", mode !== "map"); $("mMap").setAttribute("aria-pressed", mode === "map");
  $("mapbox").hidden = mode !== "map"; $("mwrap").hidden = mode === "map";
  if (mode === "map") ensureLibs().then(ok => { if (state.mode !== "map") return; if (!ok || !initMap()) $("mlegend").textContent = "Map library did not load."; else fitMap(); });
  render();
}
$("mMat").addEventListener("click", () => setMode("matrix"));
$("mMap").addEventListener("click", () => setMode("map"));

let hl = null;
$("m").addEventListener("mouseover", e => {
  const c = e.target.closest("[data-col]"); const col = c ? c.dataset.col : null;
  if (col === hl) return;
  if (hl !== null) document.querySelectorAll(`[data-col="${hl}"]`).forEach(x=>x.classList.remove("col-hl"));
  hl = col;
  if (hl !== null) document.querySelectorAll(`[data-col="${hl}"]`).forEach(x=>x.classList.add("col-hl"));
});
let qt; $("q").addEventListener("input", e => { state.q = e.target.value; clearTimeout(qt); qt = setTimeout(render, 80); });
if (state.view === "tgt") { $("vBiz").setAttribute("aria-pressed","false"); $("vTgt").setAttribute("aria-pressed","true"); }
if (state.mode === "map") setMode("map"); else render();
</script>
</body>
