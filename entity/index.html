<script>
const id = new URLSearchParams(location.search).get('id') || 'beach-hotel', c = entityOf(id);
if (!c) { document.getElementById('card').innerHTML = '<div class="con"><h3>Unknown entity</h3><p>No product or service with the id “' + id + '”.</p></div>'; }
else {
  const kind = kindOf(c); document.title = `RubiqOS · ${c.name}`; document.getElementById('crumbKind').textContent = kind === 'product' ? 'Product' : 'Service';
  document.getElementById('card').innerHTML = c.id === 'marina' ? marinaBlock(false) : c.id === 'stores' ? storesBlock(false) : kind === 'product' ? productCard(c, false) : kind === 'fleet' ? fleetCard(false) : serviceCard(c, false);
  if (kind === 'fleet' || c.id === 'marina' || c.id === 'stores') { const cd = document.getElementById('card'); cd.classList.remove('cards'); document.querySelector('.ent').style.gridTemplateColumns = '1fr'; }
  const op = OP[c.op], siblings = (kind === 'product' ? PRODUCTS : SERVICES).filter(s => s.op === c.op && s !== c);
  const ev = EVENTS.filter(e => e.venue === c.id);
  const uses = kind === 'product' ? `<div class="card"><h3>Services it uses</h3><p>Power, water and sewage from the utilities; food from the warehouse and the dark store; linen from the laundry; the fleet for guests and goods; the network for every device; guest services, the clinic and security on call.</p></div>` : '';
  document.getElementById('aside').innerHTML = `<div><div class="kind">${kind === 'product' ? 'Product' : 'Service'} · ${c.zone} ${ZONE_NAME[c.zone] || ''}</div><div class="title">${c.name}</div><div class="meta">${c.what}</div></div>
    ${ev.length ? `<div><h2>Events here</h2>${eventsTable(ev)}</div>` : kind === 'product' ? `<div class="card"><h3>Events</h3><p>No programme events at this venue.</p></div>` : ''}
    ${uses}`;
}
</script>
